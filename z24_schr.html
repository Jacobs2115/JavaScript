<!DOCTYPE html>   
<head>    
<title> proste obliczenia</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var x1_sch=prompt("x1=",""); 
var x2_sch=prompt("x2=",""); 
var x1_sch_rad=(Math.PI * x1_sch)/180;
var x2_sch_rad=(Math.PI * x2_sch)/180;
var y1_sch=3*Math.pow(x1_sch,(6/8));
var y2_sch=2*Math.cos(x1_sch_rad)+3*Math.sin(x1_sch_rad);
var y3_sch=Math.pow(Math.pow(x1_sch,5)+2*Math.pow(x2_sch,4),(1/3))*Math.abs(x1_sch-x2_sch);
document.write("X1 = " +x1_sch_rad.toFixed(2)  + "&nbsp &nbsp &nbsp &nbsp &nbsp X2 = "+x2_sch_rad.toFixed(2)  +"<br>"); 
document.write("y1="+y1_sch.toFixed(2) +   "<br>"); 
document.write("y2="+y2_sch.toFixed(2) +   "<br>"); 
document.write("y3="+y3_sch.toFixed(2)+   "<br>"); 

</script> 
</div> 
</body> 
</html>
