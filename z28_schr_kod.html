<h1>1. Rodzaje filozofii programowania</h1>
<p>Wyróżniamy programowanie strukturalne oraz programowanie obiektowe.</p>

<h1>2. Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego.</h1>
<p>Programowanie strukturalne polega na podziale kodu programu na procedury i hierarchicznie ułożone bloki. Wykorzystuje instrukcje warunkowe i pętle.</p>
<p>Założenia:</p>
<p>1. Podzielone bloki kodu mają jeden punkt wejścia.</p>
<p>2. Wykonywanie wyrażeń w określonej kolejności.</p>
<p>3. Używanie instrukcji warunkowych, np. if i if else.</p>
<p>4. Używanie pętli, np. for, while, do while.</p>
<p>5. Unikanie instrukcji skoku goto.</p>
<p>6. Unikanie instrukcji break i continue.</p>
<p>7. Funkcje i zmienne opisujące dany przedmiot nie są ze sobą powiązane.</p>

<h1>3. Programowanie obiektowe – definicja</h1>
<p>Programowanie obiektowe (ang. object-oriented programming, OOP) to sposób programowania, w którym program definiuje się za pomocą obiektów. Obiekt posiada stan, czyli dane nazywane polami, oraz zachowanie, czyli procedury nazywane metodami. Program komputerowy jest zbiorem obiektów komunikujących się ze sobą w celu wykonywania zadań.</p>

<h1>4. Dlaczego stosujemy programowanie obiektowe?</h1>
<p>Jest bardziej naturalne dla programisty, ponieważ pozwala odwzorować przedmioty ze świata rzeczywistego. Ułatwia gospodarowanie pamięcią, ponieważ niepotrzebne obiekty można usunąć. Dobrze napisana i przetestowana klasa może być używana przez innych programistów, co oszczędza czas i pieniądze.</p>

<h1>5. Pojęcia</h1>
<p><b>Klasa</b> – rodzaj foremki opisującej, jak będą wyglądać tworzone obiekty.</p>
<p><b>Obiekt</b> – instancja utworzona na podstawie klasy. Posiada właściwości i metody.</p>
<p><b>Właściwość</b> – własność obiektu, np. kolor.</p>
<p><b>Metoda</b> – czynność, którą potrafi wykonać obiekt, np. chodzenie.</p>
<p><b>Konstruktor</b> – metoda wywoływana podczas tworzenia obiektu.</p>
<p><b>Dziedziczenie</b> – klasa może przejmować właściwości i metody innej klasy.</p>
<p><b>Hermetyzacja</b> – ukrywanie części pól i metod przed zewnętrznym dostępem.</p>
<p><b>Polimorfizm</b> – wielopostaciowość, czyli możliwość różnego zachowania obiektu w zależności od sposobu uruchomienia metody.</p>
