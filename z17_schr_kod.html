<p>1. Wymień cztery sposoby wyprowadzania danych w JS.</p>

<p>2. Czym jest funkcja w JS, omów przy użyciu 4 podpunktów.</p>
<ul>
    <li>Jest to zbiór zgrupowanych instrukcji, które możemy uruchamiać poprzez podanie ich nazwy.</li>
      <li>Każda funkcja po wywołaniu wykonuje swój wewnętrzny kod.</li>
        <li>Funkcja może mieć argumenty, które wchodzą do wnętrza funkcji i są tam przetwarzane, np. suma_kry(a, b).</li>
            <li>Może (nie zawsze) zwrócić obliczoną wartość zapisaną po słowie kluczowym return.</li>
            </ul>
<p>3. Omów metody getElementsByName, getElementById, getElementByTagName.</p>
<ul>
    <li>getElementById("id") – dostęp do wszystkich elementów o konkretnej wartości atrybutu id.</li>
      <li>getElementByTagName("znacznik") – dostęp do wszystkich elementów o typie znacznika, np. P lub DIV.</li>
        <li>getElementByName("nazwa") – dostęp do wszystkich elementów o konkretnej wartości atrybutu.</li>

                </ul>
<p>4. Omów właściwości innerHTML, innerText, className (każdą osobno).</p>
<ul>
    <li>innerHTML – jest to właściwość, która umożliwia odczyt, zmodyfikowanie, wstawienie albo usunięcie kodu HTML z danego elementu HTML, np. w tabeli.</li>
      <li>innerText – umożliwia określenie ciągu znaków, który zostanie umieszczony w elemencie.</li>
        <li>className – umożliwia określenie klasy CSS użytej do prezentacji elementu.</li>
                </ul>
