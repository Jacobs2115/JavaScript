<html>
    <body>
        <div style="color:green;font-size:50px;">
            <script language="javascript">
            var liczba1=prompt("Podaj lizcbe naturalną m_sch=","");
                var m_sch=parseFloat (liczba1);

                document.write("m="+m_sch+"<br>");
                m1=m_sch+2;
                m2=(m_sch+1)*(m_sch+2);
                m3=(m_sch)*(m_sch+1);
                document.write("1/"+m_sch+"=1/"+m1+"+1/"+m2+"+1/"+m3+"<br>");
            </script>
        </div>
    </body> 
</html>
