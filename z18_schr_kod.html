     <textarea cols="100" rows="80"> 
        <!DOCTYPE html>   
<html>
   <head>    
      <title> Użycie fukcji </title>    
        <meta charset="utf-8">   
   </head>  
<body> 
     <div style="color:navy;font-size:50px;"> 
       <script language="JavaScript"> 
        var a=parseFloat(prompt("a=","")); 
        var b=parseFloat(prompt("b=","")); 
        function suma_sch(a, b) { 
        return a + b; 
       } 
       function odejmowanie_sch(a,b){
        return a - b
       }
              function mnozenie_sch(a,b){
        return a * b
       }
              function od_kwadratu_sch_a(a,b){
        return a * a
       }
             function od_kwadratu_sch_b(a,b){
         return b * b
       }
                    function reszta_z_dzielenia_a_przez_b_sch(a,b){
         return a % b
       }
        document.write("suma="+suma_sch(a,b)+"<br>"); 
        document.write("odejmowanie="+odejmowanie_sch(a,b)+"<br>"); 
        document.write("mnożenie="+mnozenie_sch(a,b)+"<br>"); 
        document.write("od_kwadratu_A="+od_kwadratu_sch_a(a,b)+"<br>"); 
        document.write("od_kwadratu_B="+od_kwadratu_sch_b(a,b)+"<br>"); 
        document.write("reszta z dzielenia="+reszta_z_dzielenia_a_przez_b_sch(a,b)+"<br>"); 

       </script> 
     </div> 
</body> 
</html>
      </textarea> 
    </body> 
</html>
